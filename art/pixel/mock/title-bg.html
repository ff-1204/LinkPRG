<p class="note">이미 그려 둔 그림들을 처음 화면 배경(18%)에 깔아 본 것입니다. 오른쪽 작은 그림은 원래 짙기입니다. 마음에 드는 것이 없으면 새로 그릴 그림의 내용(예: 종이 울리는 종루, 길 떠나는 뒷모습)을 말씀해 주세요.</p>
